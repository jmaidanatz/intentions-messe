<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1C1410" />
  <meta name="description" content="Intention de Messe du jour" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Intentions" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Inconsolata:wght@300;400&display=swap" rel="stylesheet" />

  <title>✠ Intention de Messe</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #F5F0E8;
      --dark: #1C1410;
      --darker: #0F0A08;
      --gold: #B8860B;
      --gold-light: #D4A017;
      --gold-dim: rgba(184,134,11,0.25);
      --text-dim: rgba(245,240,232,0.45);
      --text-mid: rgba(245,240,232,0.7);
      --green: #7DBF7D;
    }

    html, body {
      height: 100%;
      background: var(--darker);
      color: var(--cream);
      font-family: 'IM Fell English', Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100svh;
      background: linear-gradient(160deg, #2C1810 0%, #1C1410 45%, #0F0A08 100%);
      background-attachment: fixed;
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    #app {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 0 20px env(safe-area-inset-bottom, 20px);
      padding-bottom: 40px;
    }

    /* ── Header ── */
    header {
      text-align: center;
      padding: 48px 0 24px;
      border-bottom: 1px solid var(--gold-dim);
      margin-bottom: 28px;
    }

    .cross {
      font-size: 22px;
      color: var(--gold);
      letter-spacing: 6px;
      display: block;
      margin-bottom: 10px;
    }

    .date-label {
      font-family: 'Inconsolata', monospace;
      font-size: 11px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 10px;
    }

    h1 {
      font-size: 26px;
      font-weight: normal;
      letter-spacing: 0.5px;
      color: var(--cream);
    }

    /* ── Card ── */
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--gold-dim);
      border-radius: 3px;
      padding: 28px 22px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
      text-align: center;
      transition: opacity 0.3s;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .card.loading { opacity: 0.7; }

    /* ── Spinner ── */
    .spinner {
      width: 26px; height: 26px;
      border: 2px solid var(--gold-dim);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-family: 'Inconsolata', monospace;
      font-size: 12px;
      letter-spacing: 1.5px;
      color: var(--text-dim);
    }

    /* ── Intention content ── */
    .intention-nom {
      font-size: 22px;
      font-weight: normal;
      line-height: 1.35;
      color: var(--cream);
      margin-bottom: 18px;
    }

    .demandeur-label {
      font-family: 'Inconsolata', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
      display: block;
      margin-bottom: 3px;
    }

    .demandeur-nom {
      font-style: italic;
      font-size: 16px;
      color: var(--gold-light);
      display: block;
      margin-bottom: 14px;
    }

    .description {
      font-style: italic;
      font-size: 14px;
      color: var(--text-mid);
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .date-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Inconsolata', monospace;
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--text-dim);
      border-top: 1px solid var(--gold-dim);
      padding-top: 12px;
    }

    .multi-tag {
      display: inline-block;
      margin-top: 10px;
      font-family: 'Inconsolata', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid var(--gold-dim);
      border-radius: 2px;
      padding: 3px 8px;
    }

    /* ── Empty / Error states ── */
    .empty-icon { font-size: 30px; display: block; margin-bottom: 12px; }

    .empty-text {
      font-style: italic;
      font-size: 15px;
      color: var(--text-dim);
    }

    .error-card { border-color: rgba(200,60,60,0.35); background: rgba(200,60,60,0.05); }
    .error-icon { font-size: 26px; display: block; margin-bottom: 10px; color: #C85050; }
    .error-text { color: rgba(220,100,100,0.85); font-size: 14px; margin-bottom: 14px; }

    /* ── Buttons ── */
    .btn {
      display: block;
      width: 100%;
      padding: 12px 0;
      background: transparent;
      border: 1px solid var(--gold-dim);
      color: var(--text-dim);
      border-radius: 3px;
      cursor: pointer;
      font-family: 'Inconsolata', monospace;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 14px;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn:hover { border-color: var(--gold); color: var(--gold-light); }
    .btn:disabled { opacity: 0.4; cursor: default; }

    .btn-primary {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
      border: none;
      color: var(--dark);
      font-family: 'IM Fell English', serif;
      font-size: 15px;
      letter-spacing: 0.5px;
      font-weight: normal;
      text-transform: none;
      padding: 13px 0;
    }
    .btn-primary:hover { filter: brightness(1.1); color: var(--dark); }

    /* ── Notifications section ── */
    .notif-section {
      margin-top: 6px;
    }

    .section-title {
      font-family: 'Inconsolata', monospace;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(245,240,232,0.28);
      font-weight: normal;
      border-top: 1px solid var(--gold-dim);
      padding-top: 22px;
      margin-bottom: 16px;
    }

    .notif-info {
      font-style: italic;
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.55;
      margin-bottom: 16px;
    }

    .notif-granted { text-align: center; }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: 'Inconsolata', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--green);
      margin-bottom: 20px;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 7px var(--green);
    }

    .countdown-label {
      font-family: 'Inconsolata', monospace;
      font-size: 10px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(245,240,232,0.28);
      margin-bottom: 4px;
    }

    .countdown {
      font-family: 'Inconsolata', monospace;
      font-size: 36px;
      color: var(--gold-light);
      letter-spacing: 4px;
      margin-bottom: 20px;
    }

    .warning-text {
      font-family: 'Inconsolata', monospace;
      font-size: 10px;
      color: rgba(245,240,232,0.22);
      font-style: italic;
      line-height: 1.4;
      margin-top: 12px;
    }

    /* ── Install banner ── */
    #install-banner {
      display: none;
      background: rgba(184,134,11,0.1);
      border: 1px solid var(--gold-dim);
      border-radius: 3px;
      padding: 14px 16px;
      margin-bottom: 14px;
      text-align: center;
    }

    #install-banner p {
      font-size: 13px;
      color: var(--text-mid);
      margin-bottom: 10px;
      font-style: italic;
    }

    /* ── Numéro intention ── */
    .intention-index {
      font-family: 'Inconsolata', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 12px;
    }

    /* ── Fade-in animation ── */
    .fade-in {
      animation: fadeIn 0.4s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <span class="cross">✠</span>
      <p class="date-label" id="date-label">—</p>
      <h1>Intention de Messe</h1>
    </header>

    <div id="install-banner">
      <p>Installez l'application pour les notifications autonomes à 6h45.</p>
      <button class="btn btn-primary" id="btn-install">⬇ Installer sur l'écran d'accueil</button>
    </div>

    <div id="card-container"></div>

    <button class="btn" id="btn-refresh">↻ Actualiser</button>

    <section class="notif-section">
      <h2 class="section-title">Rappel à 6h45</h2>
      <div id="notif-container"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
