<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1C1410" />
  <meta name="description" content="Intention(s) de Messe du jour" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Intentions" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inconsolata:wght@300;400&display=swap" rel="stylesheet" />

  <title>Intentions de Messe</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #F5F0E8;
      --dark: #1C1410;
      --darker: #0F0A08;
      --gold: #B8860B;
      --gold-light: #D4A017;
      --gold-dim: rgba(184,134,11,0.25);
      --text-dim: rgba(245,240,232,0.45);
      --text-mid: rgba(245,240,232,0.7);
      --green: #7DBF7D;
    }

    html, body {
      background: #120D0A;
      color: var(--cream);
      font-family: 'Cormorant Garamond', Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 0 20px env(safe-area-inset-bottom, 20px);
      padding-bottom: 40px;
    }

    /* ── Header ── */
    header {
      text-align: center;
      padding: 48px 0 24px;
      border-bottom: 1px solid var(--gold-dim);
      margin-bottom: 28px;
    }
    .cross { font-size: 22px; color: var(--gold); letter-spacing: 6px; display: block; margin-bottom: 10px; }
    .date-label { font-family: 'Inconsolata', monospace; font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; }
    h1 { font-size: 26px; font-weight: normal; letter-spacing: 0.5px; color: var(--cream); }

    /* ── Card ── */
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--gold-dim);
      border-radius: 3px;
      padding: 28px 22px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
      text-align: center;
      transition: opacity 0.3s;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .card.loading { opacity: 0.7; }

    /* ── Spinner ── */
    .spinner { width: 26px; height: 26px; border: 2px solid var(--gold-dim); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-family: 'Inconsolata', monospace; font-size: 12px; letter-spacing: 1.5px; color: var(--text-dim); }

    /* ── Intention content ── */
    .intention-nom { font-size: 22px; font-weight: normal; line-height: 1.35; color: var(--cream); margin-bottom: 18px; }
    .demandeur-label { font-family: 'Inconsolata', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); display: block; margin-bottom: 3px; }
    .demandeur-nom { font-style: italic; font-size: 16px; color: var(--gold-light); display: block; margin-bottom: 14px; }
    .description { font-style: italic; font-size: 14px; color: var(--text-mid); line-height: 1.6; margin-bottom: 18px; }
    .date-badge { display: inline-flex; align-items: center; gap: 6px; font-family: 'Inconsolata', monospace; font-size: 11px; letter-spacing: 1px; color: var(--text-dim); border-top: 1px solid var(--gold-dim); padding-top: 12px; }
    .multi-tag { display: block; margin-top: 10px; font-family: 'Inconsolata', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); border: 1px solid var(--gold-dim); border-radius: 2px; padding: 3px 8px; }
    .intention-index { font-family: 'Inconsolata', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin-bottom: 12px; }

    /* ── Empty / Error ── */
    .empty-icon { font-size: 30px; display: block; margin-bottom: 12px; }
    .empty-text { font-style: italic; font-size: 15px; color: var(--text-dim); }
    .error-card { border-color: rgba(200,60,60,0.35); background: rgba(200,60,60,0.05); }
    .error-icon { font-size: 26px; display: block; margin-bottom: 10px; color: #C85050; }
    .error-text { color: rgba(220,100,100,0.85); font-size: 14px; margin-bottom: 14px; }

    /* ── Buttons ── */
    .btn { display: block; width: 100%; padding: 12px 0; background: transparent; border: 1px solid var(--gold-dim); color: var(--text-dim); border-radius: 3px; cursor: pointer; font-family: 'Inconsolata', monospace; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 14px; transition: border-color 0.2s, color 0.2s; }
    .btn:hover { border-color: var(--gold); color: var(--gold-light); }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-primary { background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%); border: none; color: var(--dark); font-family: 'Cormorant Garamond', serif; font-size: 15px; letter-spacing: 0.5px; font-weight: normal; text-transform: none; padding: 13px 0; }
    .btn-primary:hover { filter: brightness(1.1); color: var(--dark); }

    /* ── Section title ── */
    .section-title { font-family: 'Inconsolata', monospace; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: rgba(245,240,232,0.28); font-weight: normal; border-top: 1px solid var(--gold-dim); padding-top: 22px; margin-bottom: 16px; }

    /* ── Notifications ── */
    .notif-section { margin-top: 6px; }
    .notif-info { font-style: italic; font-size: 13px; color: var(--text-dim); line-height: 1.55; margin-bottom: 16px; }
    .notif-granted { text-align: center; }
    .status-pill { display: inline-flex; align-items: center; gap: 7px; font-family: 'Inconsolata', monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--green); margin-bottom: 20px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 7px var(--green); }
    .countdown-label { font-family: 'Inconsolata', monospace; font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(245,240,232,0.28); margin-bottom: 4px; }
    .countdown { font-family: 'Inconsolata', monospace; font-size: 36px; color: var(--gold-light); letter-spacing: 4px; margin-bottom: 20px; }
    .warning-text { font-family: 'Inconsolata', monospace; font-size: 10px; color: rgba(245,240,232,0.22); font-style: italic; line-height: 1.4; margin-top: 12px; }

    /* ── Install banner ── */
    #install-banner { display: none; background: rgba(184,134,11,0.1); border: 1px solid var(--gold-dim); border-radius: 3px; padding: 14px 16px; margin-bottom: 14px; text-align: center; }
    #install-banner p { font-size: 13px; color: var(--text-mid); margin-bottom: 10px; font-style: italic; }

    /* ══════════════════════════════════════
       ── Calendrier mensuel ──
    ══════════════════════════════════════ */

    .cal-section {
      margin-top: 6px;
      margin-bottom: 6px;
    }

    /* Navigation mois */
    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .cal-nav-btn {
      background: transparent;
      border: 1px solid var(--gold-dim);
      color: var(--text-dim);
      border-radius: 3px;
      width: 34px;
      height: 34px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, color 0.2s;
      flex-shrink: 0;
    }
    .cal-nav-btn:hover { border-color: var(--gold); color: var(--gold-light); }
    .cal-nav-btn:disabled { opacity: 0.3; cursor: default; }

    .cal-refresh-btn {
      font-size: 14px;
      opacity: 0.5;
      margin-left: 4px;
    }
    .cal-refresh-btn:hover { opacity: 1; }
    .cal-refresh-btn.spinning { opacity: 0.7; }
    .cal-refresh-btn.spinning span { display: inline-block; animation: spin 0.8s linear infinite; }

    .cal-month-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 17px;
      font-weight: normal;
      color: var(--cream);
      text-align: center;
      letter-spacing: 0.5px;
      flex: 1;
    }

    /* Liste des jours */
    .cal-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .cal-day {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 9px 12px;
      border-radius: 3px;
      transition: background 0.15s;
      border-left: 2px solid transparent;
    }

    .cal-day:hover {
      background: rgba(255,255,255,0.03);
    }

    .cal-day.today {
      border-left-color: var(--gold);
      background: rgba(184,134,11,0.07);
    }

    .cal-day-num {
      font-family: 'Inconsolata', monospace;
      font-size: 12px;
      color: var(--text-dim);
      width: 52px;
      flex-shrink: 0;
      padding-top: 2px;
      text-align: right;
      white-space: nowrap;
    }

    .cal-day-name {
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-right: 5px;
      opacity: 0.7;
    }

    .cal-day.today .cal-day-num {
      color: var(--gold-light);
    }
    .cal-day.today .cal-day-name {
      opacity: 1;
    }

    .cal-day-content {
      flex: 1;
      min-width: 0;
    }

    .cal-intention {
      font-size: 13px;
      color: var(--cream);
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cal-intention + .cal-intention {
      margin-top: 7px;
    }

    .cal-entry + .cal-entry {
      margin-top: 7px;
    }

    .cal-intention .fixe-mark {
      color: var(--gold);
      font-size: 10px;
      margin-left: 3px;
    }

    .cal-demandeur {
      font-family: 'Inconsolata', monospace;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.5px;
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cal-empty-day {
      font-family: 'Inconsolata', monospace;
      font-size: 11px;
      color: rgba(245,240,232,0.15);
      font-style: italic;
    }

    .cal-loading {
      text-align: center;
      padding: 24px 0;
    }

    .cal-loading .spinner {
      margin: 0 auto 8px;
    }

    /* Séparateur inter-jour */
    .cal-day-sep {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 6px;
      margin: 0 20px;
    }
    .cal-day-sep::after {
      content: '';
      display: block;
      width: 40%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(184,134,11,0.35), transparent);
    }

    /* ── Fade-in ── */
    .fade-in { animation: fadeIn 0.4s ease forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <span class="cross">✠</span>
      <p class="date-label" id="date-label">—</p>
      <h1>Intentions de Messe</h1>
    </header>

    <div id="install-banner">
      <p>Installez l'application pour les notifications autonomes à 6h45.</p>
      <button class="btn btn-primary" id="btn-install">⬇ Installer sur l'écran d'accueil</button>
    </div>

    <div id="card-container"></div>

    <button class="btn" id="btn-refresh">↻ Actualiser</button>

    <!-- Calendrier mensuel -->
    <section class="cal-section">
      <h2 class="section-title">Agenda des intentions</h2>
      <div class="cal-nav">
        <button class="cal-nav-btn cal-refresh-btn" id="cal-refresh-all" title="Tout réactualiser"><span>⟲</span></button>
        <button class="cal-nav-btn" id="cal-prev">&#8592;</button>
        <span class="cal-month-label" id="cal-month-label">—</span>
        <button class="cal-nav-btn" id="cal-next">&#8594;</button>
        <button class="cal-nav-btn cal-refresh-btn" id="cal-refresh" title="Actualiser"><span>⟳</span></button>
      </div>
      <div id="cal-list" class="cal-list"></div>
    </section>

    <section class="notif-section">
      <h2 class="section-title">Rappel à 6h45</h2>
      <div id="notif-container"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
